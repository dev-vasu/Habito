<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&amp;family=JetBrains+Mono:wght@700&amp;display=swap');
      .font-sans { font-family: 'Space Grotesk', -apple-system, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="640" fill="#14131A" rx="24"/>
  <rect x="12" y="12" width="1176" height="616" fill="none" stroke="#262433" stroke-width="2" rx="16"/>

  <!-- Showcase Header -->
  <g transform="translate(60, 50)" class="font-sans">
    <rect x="0" y="0" width="160" height="28" rx="6" fill="#FF6B6B" stroke="#1E1E1E" stroke-width="2"/>
    <text x="80" y="19" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">FEATURE SHOWCASE 01</text>
    
    <text x="0" y="65" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Neo-Brutalist Daily Engine</text>
    <text x="0" y="92" font-size="15" font-weight="700" fill="#8E8B9E">Tactile 3D checkboxes, dynamic fuel meters, and personalized user identity.</text>
  </g>

  <!-- Left: Annotated Feature Callouts -->
  <g transform="translate(60, 185)" class="font-sans">
    <!-- Callout 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="460" height="96" rx="16" fill="#1E1C27" stroke="#2E2C3D" stroke-width="2"/>
      <rect x="18" y="18" width="42" height="42" rx="10" fill="#FFE66D" stroke="#1E1E1E" stroke-width="2"/>
      <text x="39" y="44" font-size="20" text-anchor="middle">⚡</text>
      <text x="74" y="38" font-size="16" font-weight="900" fill="#FFFFFF">Energy Fuel Gauge</text>
      <text x="74" y="58" font-size="12" font-weight="700" fill="#9D99AF">Replaces generic bars with an energetic, framed live progress meter.</text>
    </g>

    <!-- Callout 2 -->
    <g transform="translate(0, 114)">
      <rect x="0" y="0" width="460" height="96" rx="16" fill="#1E1C27" stroke="#2E2C3D" stroke-width="2"/>
      <rect x="18" y="18" width="42" height="42" rx="10" fill="#6BCB77" stroke="#1E1E1E" stroke-width="2"/>
      <text x="39" y="44" font-size="20" text-anchor="middle">✓</text>
      <text x="74" y="38" font-size="16" font-weight="900" fill="#FFFFFF">3D Tactile Protocols</text>
      <text x="74" y="58" font-size="12" font-weight="700" fill="#9D99AF">Buttons physically depress into the surface with hard 4px offset shadows.</text>
    </g>

    <!-- Callout 3 -->
    <g transform="translate(0, 228)">
      <rect x="0" y="0" width="460" height="96" rx="16" fill="#1E1C27" stroke="#2E2C3D" stroke-width="2"/>
      <rect x="18" y="18" width="42" height="42" rx="10" fill="#4D96FF" stroke="#1E1E1E" stroke-width="2"/>
      <text x="39" y="44" font-size="18" text-anchor="middle">🎯</text>
      <text x="74" y="38" font-size="16" font-weight="900" fill="#FFFFFF">Frequency Goal Targets</text>
      <text x="74" y="58" font-size="12" font-weight="700" fill="#9D99AF">Schedule 7/7 Daily, 5/7 Weekdays, or flexible 3x/week targets.</text>
    </g>
  </g>

  <!-- Right: Phone Device Mockup Frame -->
  <g transform="translate(680, 50)" class="font-sans">
    <!-- Phone Shadow -->
    <rect x="14" y="14" width="380" height="540" rx="36" fill="#0A090D"/>
    <!-- Phone Body -->
    <rect x="0" y="0" width="380" height="540" rx="36" fill="#FFFDF0" stroke="#1E1E1E" stroke-width="6"/>

    <!-- App Header inside Phone -->
    <g transform="translate(24, 30)">
      <!-- Top Row Badges -->
      <rect x="0" y="0" width="60" height="24" rx="6" fill="#FF6B6B" stroke="#1E1E1E" stroke-width="2"/>
      <text x="30" y="16" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">TODAY</text>

      <rect x="230" y="0" width="102" height="24" rx="6" fill="#4D96FF" stroke="#1E1E1E" stroke-width="2"/>
      <text x="281" y="16" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">🔥 7 STREAK</text>

      <!-- App Title -->
      <text x="0" y="60" font-size="26" font-weight="900" fill="#1E1E1E" letter-spacing="-0.5">DO THE THING.</text>
      <text x="0" y="78" font-size="11" font-weight="700" fill="#666666">Show up, check the box, conquer the day.</text>

      <!-- Fuel Card -->
      <g transform="translate(0, 94)">
        <!-- Hard shadow -->
        <rect x="4" y="4" width="332" height="90" rx="14" fill="#1E1E1E"/>
        <!-- Main box -->
        <rect x="0" y="0" width="332" height="90" rx="14" fill="#FFE66D" stroke="#1E1E1E" stroke-width="2.5"/>
        <text x="14" y="24" font-size="12" font-weight="900" fill="#1E1E1E">TODAY'S FUEL</text>
        <text x="318" y="24" font-size="14" font-weight="900" fill="#1E1E1E" text-anchor="end">75%</text>

        <!-- Progress meter -->
        <rect x="14" y="34" width="304" height="16" rx="6" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="2"/>
        <rect x="16" y="36" width="228" height="12" rx="4" fill="#1E1E1E"/>

        <text x="14" y="68" font-size="10" font-weight="800" fill="#1E1E1E">1 protocol remaining today</text>
        <text x="318" y="68" font-size="10" font-weight="800" fill="#1E1E1E" text-anchor="end">3 of 4 done</text>
      </g>

      <!-- Protocol Item 1 -->
      <g transform="translate(0, 204)">
        <rect x="3" y="3" width="332" height="54" rx="14" fill="#1E1E1E"/>
        <rect x="0" y="0" width="332" height="54" rx="14" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="2"/>
        <!-- Checked button -->
        <rect x="12" y="11" width="32" height="32" rx="8" fill="#6BCB77" stroke="#1E1E1E" stroke-width="2"/>
        <text x="28" y="33" font-size="16" font-weight="900" fill="#1E1E1E" text-anchor="middle">✓</text>
        <text x="56" y="26" font-size="13" font-weight="900" fill="#999999" text-decoration="line-through">Hydrate 2.5L</text>
        <text x="56" y="42" font-size="10" font-weight="700" fill="#AAAAAA">8 cups completed</text>
        <!-- Tag -->
        <rect x="264" y="15" width="56" height="22" rx="6" fill="#4D96FF" stroke="#1E1E1E" stroke-width="1.5"/>
        <text x="292" y="30" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">7/7</text>
      </g>

      <!-- Protocol Item 2 -->
      <g transform="translate(0, 268)">
        <rect x="3" y="3" width="332" height="54" rx="14" fill="#1E1E1E"/>
        <rect x="0" y="0" width="332" height="54" rx="14" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="2"/>
        <!-- Checked button -->
        <rect x="12" y="11" width="32" height="32" rx="8" fill="#6BCB77" stroke="#1E1E1E" stroke-width="2"/>
        <text x="28" y="33" font-size="16" font-weight="900" fill="#1E1E1E" text-anchor="middle">✓</text>
        <text x="56" y="26" font-size="13" font-weight="900" fill="#999999" text-decoration="line-through">Deep Reading</text>
        <text x="56" y="42" font-size="10" font-weight="700" fill="#AAAAAA">25 pages completed</text>
        <!-- Tag -->
        <rect x="264" y="15" width="56" height="22" rx="6" fill="#FF9F43" stroke="#1E1E1E" stroke-width="1.5"/>
        <text x="292" y="30" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">5/7</text>
      </g>

      <!-- Protocol Item 3 (Active) -->
      <g transform="translate(0, 332)">
        <rect x="4" y="4" width="332" height="54" rx="14" fill="#1E1E1E"/>
        <rect x="0" y="0" width="332" height="54" rx="14" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="2.5"/>
        <!-- Empty Button -->
        <rect x="12" y="11" width="32" height="32" rx="8" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="2"/>
        <text x="56" y="26" font-size="13" font-weight="900" fill="#1E1E1E">Ship Code</text>
        <text x="56" y="42" font-size="10" font-weight="700" fill="#666666">2 focused commits</text>
        <!-- Tag -->
        <rect x="264" y="15" width="56" height="22" rx="6" fill="#9D4EDD" stroke="#1E1E1E" stroke-width="1.5"/>
        <text x="292" y="30" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">5/7</text>
      </g>

      <!-- Protocol Item 4 -->
      <g transform="translate(0, 396)">
        <rect x="3" y="3" width="332" height="54" rx="14" fill="#1E1E1E"/>
        <rect x="0" y="0" width="332" height="54" rx="14" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="2"/>
        <rect x="12" y="11" width="32" height="32" rx="8" fill="#6BCB77" stroke="#1E1E1E" stroke-width="2"/>
        <text x="28" y="33" font-size="16" font-weight="900" fill="#1E1E1E" text-anchor="middle">✓</text>
        <text x="56" y="26" font-size="13" font-weight="900" fill="#999999" text-decoration="line-through">Cardio / Run</text>
        <text x="56" y="42" font-size="10" font-weight="700" fill="#AAAAAA">5km crushed</text>
        <rect x="264" y="15" width="56" height="22" rx="6" fill="#6BCB77" stroke="#1E1E1E" stroke-width="1.5"/>
        <text x="292" y="30" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">3/7</text>
      </g>
    </g>
  </g>
</svg>
